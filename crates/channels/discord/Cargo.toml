[package]
name = "kura-discord"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
description = "Discord channel connector (port of daemon/internal/connectors/discord)"

[dependencies]
kura-imtypes = { workspace = true }
kura-connectors = { workspace = true }
kura-im = { workspace = true }
kura-store = { workspace = true }
kura-events = { workspace = true }
kura-router = { workspace = true }
kura-telemetry = { workspace = true }
kura-chat = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "sync"] }
ureq = { workspace = true, features = ["json"] }
# Gateway receive loop (direct third-party deps per migration conventions).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"] }
futures-util = "0.3"
# rustls 0.22 (pulled by tokio-tungstenite 0.24) needs an explicit crypto
# provider; the ring provider reuses the workspace's already-built ring.
rustls = { version = "0.22", default-features = false, features = ["ring", "logging", "tls12"] }

[dev-dependencies]
tempfile = "3"
futures = { workspace = true }
kura-llm = { workspace = true }
kura-runtime = { workspace = true }
kura-checkpoints = { workspace = true }
