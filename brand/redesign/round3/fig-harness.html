<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fig r2 harness</title>
<style>
  body { font-family: ui-monospace, monospace; background: #fff; margin: 24px; }
  .row { display: flex; align-items: flex-end; gap: 28px; margin-bottom: 28px; }
  .cell { text-align: center; }
  .cell small { display: block; color: #888; margin-top: 6px; }
  .dark { background: #17181C; padding: 16px; }
  .light { background: #F2F4F8; padding: 16px; }
  img { display: block; margin: 0 auto; }
  h3 { margin: 8px 0 4px; }
</style>
</head>
<body>
  <h3>A — deep-eave saltbox</h3>
  <div class="row light">
    <div class="cell"><img src="fig-r2a.svg" width="104" height="104"><small>104</small></div>
    <div class="cell"><img src="fig-r2a.svg" width="48" height="48"><small>48</small></div>
    <div class="cell"><img src="fig-r2a.svg" width="28" height="28"><small>28</small></div>
    <div class="cell"><img src="fig-r2a.svg" width="16" height="16"><small>16</small></div>
  </div>
  <div class="row dark">
    <div class="cell"><img src="fig-r2a-inverse.svg" width="104" height="104"><small>104 inv</small></div>
    <div class="cell"><img src="fig-r2a-inverse.svg" width="28" height="28"><small>28 inv</small></div>
    <div class="cell"><img src="fig-r2a-inverse.svg" width="16" height="16"><small>16 inv</small></div>
  </div>
  <h3>B — monumental front</h3>

  </div>
  <div class="row dark">
    <div class="cell"><img src="fig-r2b-inverse.svg" width="104" height="104"><small>104 inv</small></div>
    <div class="cell"><img src="fig-r2b-inverse.svg" width="28" height="28"><small>28 inv</small></div>
    <div class="cell"><img src="fig-r2b-inverse.svg" width="16" height="16"><small>16 inv</small></div>
  </div>

    <div class="cell"><img src="fig-r2c.svg" width="104" height="104"><small>104</small></div>

  </div>

</html>
