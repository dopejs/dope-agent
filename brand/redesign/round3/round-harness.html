<!doctype html>
<html>
<head>

<title>Round3 r2 harness</title>
<style>

      <div class="cell"><img src="round-r2a.svg" width="48" height="48"><span class="label">48</span></div>
      <div class="cell"><img src="round-r2a.svg" width="28" height="28"><span class="label">28</span></div>

  </div>
  <div class="dark">

      <div class="cell"><img src="round-r2a-inverse.svg" width="104" height="104"><span class="label">A inv 104</span></div>
