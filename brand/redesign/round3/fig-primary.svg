<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="kura-fig-title">
  <title id="kura-fig-title">Kura</title>
  <!-- single silhouette: saltbox gable — steep short left slope, long low right slope,
       stepped eave shelves, strongly battered plaster wall. fill+stroke rounds corners uniformly -->
  <path d="M27 8 L52 22.5 L52 27.5 L45 27.5 L50 54 L14 54 L19 24.5 L12.5 24.5 L12.5 20 Z"
        fill="#17181C" stroke="#17181C" stroke-width="4" stroke-linejoin="round"/>
  <!-- knockout window, upper left -->
  <rect x="22.5" y="30" width="5.5" height="5.5" rx="1.5" fill="#F2F4F8"/>
  <!-- persimmon door, right of center -->
  <path fill="#E4572E" d="M30 56 V43 A2 2 0 0 1 32 41 H37 A2 2 0 0 1 39 43 V56 Z"/>
</svg>
