<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>geo round3 harness v3 — planes K refinement</title>
<style>
  body { margin: 0; padding: 32px; background: #F2F4F8; font: 12px/1.4 -apple-system, sans-serif; color: #17181C; }
  .row { display: flex; align-items: flex-end; gap: 48px; margin-bottom: 56px; }
  .cell { text-align: center; }
  .cell svg { display: block; margin: 0 auto 6px; }
  .dark { background: #17181C; padding: 24px; }
  .dark .cell { color: #F2F4F8; }
  h2 { font-size: 13px; margin: 0 0 12px; }
  .grid { background-image: linear-gradient(#e3e6ee 1px, transparent 1px), linear-gradient(90deg, #e3e6ee 1px, transparent 1px); background-size: 13px 13px; }
</style>
</head>
<body>

<h2>C — sharp nose, current spacing</h2>
<div class="row"></div>

<h2>D1 — blunt nose 8 (face x=30)</h2>
<div class="row"></div>

<h2>D2 — blunt nose 6</h2>
<div class="row"></div>

<h2>D3 — blunt nose 8, tighter gap (bar 12..20)</h2>
<div class="row"></div>

<h2>E — accent bar + ink chevron, blunt 8</h2>
<div class="row"></div>

<div class="dark">
<h2>inverse (dark bg)</h2>
<div class="row"></div>
</div>

<script>
const INK = "#17181C", PAPER = "#F2F4F8", ACC = "#E4572E";

const marks = {
  ksharp: (fg, acc) => `
    <rect x="10" y="10" width="8" height="44" fill="${fg}"/>
    <path d="M52 10 30 32 52 54" fill="none" stroke="${acc}" stroke-width="8" stroke-linejoin="miter"/>`,

  kblunt8: (fg, acc) => `
    <rect x="10" y="10" width="8" height="44" fill="${fg}"/>
    <path d="M52 10 34 28V36L52 54" fill="none" stroke="${acc}" stroke-width="8" stroke-linejoin="miter"/>`,

  kblunt6: (fg, acc) => `
    <rect x="10" y="10" width="8" height="44" fill="${fg}"/>
    <path d="M52 10 34 29V35L52 54" fill="none" stroke="${acc}" stroke-width="8" stroke-linejoin="miter"/>`,

  kblunt8tight: (fg, acc) => `
    <rect x="12" y="10" width="8" height="44" fill="${fg}"/>
    <path d="M52 10 34 28V36L52 54" fill="none" stroke="${acc}" stroke-width="8" stroke-linejoin="miter"/>`,

  kblunt8swap: (fg, acc) => `
    <rect x="10" y="10" width="8" height="44" fill="${acc}"/>
    <path d="M52 10 34 28V36L52 54" fill="none" stroke="${fg}" stroke-width="8" stroke-linejoin="miter"/>`,
};

function cell(name, size, fg, acc, big) {
  return `<div class="cell${big?' grid':''}"><svg width="${size}" height="${size}" viewBox="0 0 64 64">${marks[name](fg, acc)}</svg>${size}</div>`;
}

const rows = document.querySelectorAll(".row");
const sizes = [416, 208, 104, 32, 16];
const names = ["ksharp", "kblunt8", "kblunt6", "kblunt8tight", "kblunt8swap"];
names.forEach((n, i) => {
  rows[i].innerHTML = sizes.map((s, j) => cell(n, s, INK, ACC, j === 0)).join("");
});
rows[5].innerHTML = names.map(n => [104, 16].map(s => cell(n, s, PAPER, ACC)).join("")).join("");
</script>
</body>
</html>
